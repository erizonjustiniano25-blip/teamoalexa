<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Para Ti 🌻</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcf8f2;
            color: #4a3e3d;
            overflow-x: hidden;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        .font-serif-romantic {
            font-family: 'Playfair Display', serif;
        }

        /* Glassmorphism card styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.12);
        }

        /* Heart outline and flower container */
        .heart-glow {
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        /* Floating background elements */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #f1c40f;
            border-radius: 4px;
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #d97706;
            animation: blink 0.75s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Start Overlay Animation */
        .overlay-pulse {
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-amber-200 selection:text-amber-900">

    <canvas id="bgCanvas"></canvas>

    <!-- Initial Interactive Overlay / Gift Box -->
    <div id="startOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-amber-50/95 backdrop-blur-md transition-opacity duration-700 p-4">
        <div class="text-center max-w-md mx-auto">
            <div class="relative inline-block mb-6">
                <div class="w-24 h-24 sm:w-28 sm:h-28 bg-amber-400 rounded-full flex items-center justify-center text-4xl sm:text-5xl shadow-lg overlay-pulse cursor-pointer hover:scale-105 transition-transform" id="btnStart">
                    🌻
                </div>
            </div>
            <h1 class="text-3xl sm:text-4xl font-serif-romantic font-bold text-amber-900 mb-2">Un regalo para ti</h1>
            <p class="text-gray-600 mb-6 text-sm sm:text-base">Haz clic en el girasol para abrir tu sorpresa especial</p>
            <button id="btnStartText" class="px-8 py-3 bg-gradient-to-r from-amber-500 to-yellow-400 text-white font-semibold rounded-full shadow-md hover:shadow-lg hover:from-amber-600 hover:to-yellow-500 transition duration-300 transform hover:-translate-y-0.5">
                Abrir Flores Amarillas ✨
            </button>
        </div>
    </div>

    <main class="container mx-auto px-4 py-6 md:py-10 flex-grow flex flex-col justify-center items-center z-20">
        
        <!-- Header Title -->
        <header class="text-center mb-6 md:mb-8 opacity-0 transition-opacity duration-1000" id="mainHeader">
            <span class="inline-block px-4 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold tracking-wider uppercase mb-2">Especial Para Ti</span>
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-serif-romantic text-amber-900 font-bold tracking-tight">Flores Amarillas 🌻</h1>
            <p class="text-amber-700/80 font-handwriting text-2xl mt-1">Con todo mi amor</p>
        </header>

        <!-- Main Display Grid -->
        <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <div class="lg:col-span-5 order-2 lg:order-1 space-y-6">
                <div class="glass-card p-6 md:p-8 rounded-3xl relative overflow-hidden transition-all duration-500">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-200/40 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-yellow-300/30 rounded-full blur-2xl pointer-events-none"></div>

                    <h2 class="text-2xl font-serif-romantic text-amber-950 font-bold mb-4 flex items-center gap-2">
                        <span>Para el amor de mi vida</span>
                        <i class="fa-solid font-normal fa-heart text-amber-500 text-sm animate-pulse"></i>
                    </h2>

                    <!-- Typewriter Text Container -->
                    <div class="min-h-[140px] text-gray-700 leading-relaxed font-medium text-base md:text-lg mb-2">
                        <span id="typewriter"></span><span class="cursor" id="typeCursor">&nbsp;</span>
                    </div>
                </div>

                <!-- Interactive Message Buttons -->
                <div class="flex flex-wrap gap-3 justify-center lg:justify-start">
                    <button id="btnReplay" class="px-5 py-2.5 bg-white/80 hover:bg-white text-amber-800 border border-amber-200 rounded-full text-sm font-semibold shadow-sm hover:shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Florecer de nuevo
                    </button>
                    <button id="btnMusicToggle" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-full text-sm font-semibold shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-music" id="musicIcon"></i> <span id="musicText">Música de fondo</span>
                    </button>
                </div>
            </div>

            <div class="lg:col-span-7 order-1 lg:order-2 flex flex-col items-center justify-center">
                <div class="relative w-full max-w-[500px] aspect-square flex items-center justify-center">
                    <!-- Tree Canvas Render Area -->
                    <canvas id="treeCanvas" width="600" height="600" class="w-full h-full object-contain heart-glow"></canvas>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-amber-800/60 font-medium z-20">
        Hecho con <i class="fa-solid fa-heart text-amber-500"></i> para recordar lo mucho que te amo
    </footer>

    <script>
        // Romantic Messages Array
        const romanticMessages = [
            "Si pudiera elegir un lugar seguro en el mundo, siempre sería a tu lado.",
            "Cuanto más tiempo pasa, más me doy cuenta de lo afortunado/a que soy de tenerte.",
            "Esta flor de oro representa la luz brillante que le das a mis días.",
            "Eres mi persona favorita, hoy, mañana y para siempre. — ¡Te Amo! ❤️"
        ];

        // Canvas Setup for Background Floating Petals
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgWidth, bgHeight;

        function resizeBgCanvas() {
            bgWidth = bgCanvas.width = window.innerWidth;
            bgHeight = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        // Background Petals & Hearts particles
        const particles = [];
        class PetalParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * bgWidth;
                this.y = -20;
                this.size = Math.random() * 8 + 4;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 2 - 1;
                this.color = Math.random() > 0.3 ? '#facc15' : '#fbbf24'; // Yellow variations
                this.opacity = Math.random() * 0.7 + 0.3;
                this.isHeart = Math.random() < 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > bgHeight + 20) this.reset();
            }
            draw() {
                bgCtx.save();
                bgCtx.translate(this.x, this.y);
                bgCtx.rotate((this.rotation * Math.PI) / 180);
                bgCtx.globalAlpha = this.opacity;
                bgCtx.fillStyle = this.color;

                if (this.isHeart) {
                    // Draw mini floating heart
                    bgCtx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    bgCtx.moveTo(0, topCurveHeight);
                    bgCtx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    bgCtx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    bgCtx.bezierCurveTo(0, (this.size + topCurveHeight) / 2, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    bgCtx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    bgCtx.fill();
                } else {
                    // Draw petal ellipse
                    bgCtx.beginPath();
                    bgCtx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                    bgCtx.fill();
                }
                bgCtx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            const p = new PetalParticle();
            p.y = Math.random() * bgHeight; // Spread initially
            particles.push(p);
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgWidth, bgHeight);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        const treeCanvas = document.getElementById('treeCanvas');
        const ctx = treeCanvas.getContext('2d');
        const width = treeCanvas.width;
        const height = treeCanvas.height;

        let animationProgress = 0;
        let animationFrameId = null;
        let flowersList = [];

        // Generate Heart points algorithm
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        // Generate all flower locations inside heart shape
        function generateHeartFlowers(count) {
            const flowers = [];
            let iterations = 0;
            while (flowers.length < count && iterations < 10000) {
                iterations++;
                const t = Math.random() * Math.PI * 2;
                const point = getHeartPoint(t);
                
                const scale = Math.sqrt(Math.random()) * 11; 
                const cx = width / 2 + point.x * scale;
                const cy = height / 2 - 70 + point.y * scale;

                flowers.push({
                    x: cx,
                    y: cy,
                    size: Math.random() * 8 + 10,
                    delay: Math.random() * 0.6 + 0.4,
                    color: Math.random() > 0.2 ? '#facc15' : '#fbbf24',
                    centerColor: '#78350f',
                    petals: Math.floor(Math.random() * 3) + 7
                });
            }
            return flowers;
        }

        // Draw individual sunflower
        function drawSunflower(x, y, radius, petalsCount, flowerColor, centerColor, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Petals
            ctx.fillStyle = flowerColor;
            for (let i = 0; i < petalsCount; i++) {
                ctx.rotate((Math.PI * 2) / petalsCount);
                ctx.beginPath();
                ctx.ellipse(0, radius * 0.7, radius * 0.35, radius * 0.75, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Center core
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
            ctx.fillStyle = centerColor;
            ctx.fill();

            // Inner core details
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#451a03';
            ctx.fill();

            ctx.restore();
        }

        // Main Tree Growth Render Loop
        function renderTree(progress) {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Trunk
            const trunkProgress = Math.min(progress / 0.4, 1);
            if (trunkProgress > 0) {
                ctx.save();
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(width / 2, height - 40);
                
                const currentY = (height - 40) - (220 * trunkProgress);
                ctx.bezierCurveTo(
                    width / 2 - 10, height - 120,
                    width / 2 + 15, height - 180,
                    width / 2, currentY
                );
                
                ctx.lineWidth = 28 * (1 - trunkProgress * 0.3);
                ctx.strokeStyle = '#5c3d2e';
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(width / 2, height - 35, 60, 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#422a1d';
                ctx.fill();

                if (trunkProgress > 0.5) {
                    const branchProgress = (trunkProgress - 0.5) / 0.5;
                    ctx.strokeStyle = '#5c3d2e';

                    // Left branch
                    ctx.beginPath();
                    ctx.lineWidth = 12 * branchProgress;
                    ctx.moveTo(width / 2 - 2, height - 190);
                    ctx.quadraticCurveTo(width / 2 - 60, height - 240, width / 2 - 90 * branchProgress, height - 270 * branchProgress - 20);
                    ctx.stroke();

                    // Right branch
                    ctx.beginPath();
                    ctx.lineWidth = 12 * branchProgress;
                    ctx.moveTo(width / 2 + 2, height - 190);
                    ctx.quadraticCurveTo(width / 2 + 60, height - 240, width / 2 + 90 * branchProgress, height - 270 * branchProgress - 20);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 2. Draw Heart Flower Canopy
            if (progress > 0.35) {
                const canopyProgress = (progress - 0.35) / 0.65;

                flowersList.forEach(flower => {
                    if (canopyProgress >= flower.delay - 0.35) {
                        const localProgress = Math.min((canopyProgress - (flower.delay - 0.35)) / 0.3, 1);
                        const easeScale = Math.sin((localProgress * Math.PI) / 2);

                        drawSunflower(
                            flower.x, 
                            flower.y, 
                            flower.size, 
                            flower.petals, 
                            flower.color, 
                            flower.centerColor, 
                            easeScale
                        );
                    }
                });
            }
        }

        function startTreeAnimation() {
            flowersList = generateHeartFlowers(180);
            let startTime = null;
            const duration = 3500;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                animationProgress = Math.min(elapsed / duration, 1);

                renderTree(animationProgress);

                if (animationProgress < 1) {
                    animationFrameId = requestAnimationFrame(step);
                }
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(step);
        }

        const typewriterEl = document.getElementById('typewriter');
        let currentMsgIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typewriterTimeout = null;

        function typeWriter() {
            const currentText = romanticMessages[currentMsgIndex];

            if (isDeleting) {
                typewriterEl.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterEl.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 30 : 60;

            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2500;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                currentMsgIndex = (currentMsgIndex + 1) % romanticMessages.length;
                typeSpeed = 500;
            }

            typewriterTimeout = setTimeout(typeWriter, typeSpeed);
        }

        let audioCtx = null;
        let isPlayingMusic = false;
        let musicInterval = null;

        function playRomanticChords() {
            if (!isPlayingMusic) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const notes = [261.63, 329.63, 392.00, 493.88, 523.25];
            const now = audioCtx.currentTime;

            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.15);

                gain.gain.setValueAtTime(0, now + idx * 0.15);
                gain.gain.linearRampToValueAtTime(0.04, now + idx * 0.15 + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.15 + 2.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + idx * 0.15);
                osc.stop(now + idx * 0.15 + 2.6);
            });
        }

        function toggleMusic() {
            const musicIcon = document.getElementById('musicIcon');
            const musicText = document.getElementById('musicText');

            if (!isPlayingMusic) {
                isPlayingMusic = true;
                musicIcon.className = "fa-solid fa-volume-high animate-bounce";
                musicText.textContent = "Música: Encendida";
                playRomanticChords();
                musicInterval = setInterval(playRomanticChords, 4000);
            } else {
                isPlayingMusic = false;
                musicIcon.className = "fa-solid fa-music";
                musicText.textContent = "Música de fondo";
                if (musicInterval) clearInterval(musicInterval);
            }
        }

        const startOverlay = document.getElementById('startOverlay');
        const btnStart = document.getElementById('btnStart');
        const btnStartText = document.getElementById('btnStartText');
        const btnReplay = document.getElementById('btnReplay');
        const btnMusicToggle = document.getElementById('btnMusicToggle');
        const mainHeader = document.getElementById('mainHeader');

        function launchApp() {
            startOverlay.classList.add('opacity-0');
            setTimeout(() => {
                startOverlay.style.display = 'none';
                mainHeader.classList.remove('opacity-0');
                startTreeAnimation();
                if (!typewriterTimeout) typeWriter();
            }, 700);
        }

        btnStart.addEventListener('click', launchApp);
        btnStartText.addEventListener('click', launchApp);

        btnReplay.addEventListener('click', () => {
            startTreeAnimation();
        });

        btnMusicToggle.addEventListener('click', toggleMusic);

        renderTree(0);
    </script>
</body>
</html>
